services:
  # Backend Express REST API Service
  - type: web
    name: docpulse-backend
    env: node
    plan: free
    buildCommand: cd server && npm install && npx prisma generate --schema=./prisma/schema.prisma
    startCommand: cd server && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # Frontend React SPA Service
  - type: web
    name: docpulse-frontend
    env: static
    plan: free
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: ./client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
